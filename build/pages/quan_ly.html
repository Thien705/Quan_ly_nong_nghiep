<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="/qlvt/build/assets/js/session.js"></script>
  <title>Quản lý thông tin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    table thead th {
      background-color: #16a34a;
      color: white !important;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
    table tbody tr:nth-child(even) {
      background-color: #f0fdf4;
    }
    table tbody tr:hover {
      background-color: #dcfce7;
      transition: 0.2s;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-100 to-green-50 min-h-screen flex">
  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 flex flex-col w-64 bg-gradient-to-b from-green-600 to-green-400 shadow-xl rounded-r-3xl z-50">
    <div class="flex items-center gap-2 px-6 py-6">
      <i class="fas fa-seedling text-3xl text-white"></i>
      <span class="text-xl font-bold text-white">Quản lý nông nghiệp</span>
    </div>
    <nav class="flex flex-col gap-2 px-4">
      <a href="trang_chu.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-700 text-white font-medium shadow transition duration-200 hover:shadow-xl hover:bg-green-800 hover:scale-105">
        <i class="fas fa-home text-xl"></i>
        <span>Trang chủ</span>
      </a>
      <a href="bang_thong_tin.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-700 text-white font-medium shadow transition duration-200 hover:shadow-xl hover:bg-green-800 hover:scale-105">
        <i class="fas fa-table text-xl"></i>
        <span>Bảng thông tin</span>
      </a>
  <a href="quan_ly.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-700 text-white font-medium shadow transition duration-200 hover:shadow-xl hover:bg-green-800 hover:scale-105">
        <i class="fas fa-database text-xl"></i>
        <span>Quản lý thông tin</span>
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 ml-64 p-6 space-y-8">
    <!-- Khung tiêu đề -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-green-700">Quản lý thông tin</h1>
      <div id="user-info" class="flex items-center gap-2">
        <span class="font-semibold text-green-700 border border-green-500 rounded px-3 py-1 bg-white shadow" id="username-display"></span>
        <a href="#" data-logout class="text-sm text-blue-500 underline">Đăng xuất</a>
      </div>
    </div>

    <!-- Form quản lý cây trồng -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="font-semibold text-lg text-green-700 mb-4">🌱 Quản lý cây trồng</h2>
      <form id="formCayTrong" class="flex flex-wrap gap-4 items-end">
        <input type="text" id="MaC" placeholder="Mã cây" class="border px-3 py-2 rounded w-32" required>
        <input type="text" id="TenC" placeholder="Tên cây" class="border px-3 py-2 rounded w-40" required>
        <input type="text" id="CachCanhTac" placeholder="Cách canh tác" class="border px-3 py-2 rounded w-40">
        <input type="text" id="PhanBon" placeholder="Phân bón" class="border px-3 py-2 rounded w-40">
        <input type="text" id="NguonGoc" placeholder="Nguồn gốc" class="border px-3 py-2 rounded w-40">
        <div class="w-full flex gap-4 mt-4">
          <button type="button" id="addCayTrong" class="bg-green-600 text-white px-4 py-2 rounded font-semibold">Thêm</button>
          <button type="button" id="editCayTrong" class="bg-yellow-500 text-white px-4 py-2 rounded font-semibold">Sửa</button>
          <button type="button" id="deleteCayTrong" class="bg-red-500 text-white px-4 py-2 rounded font-semibold">Xóa</button>
          <button type="button" id="resetCayTrong" class="bg-gray-400 text-white px-4 py-2 rounded font-semibold">Reset</button>
        </div>
      </form>
    </div>

    <!-- Form quản lý nông dân -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="font-semibold text-lg text-green-700 mb-4">👩‍🌾 Quản lý nông dân</h2>
      <form id="formNongDan" class="flex flex-wrap gap-4 items-end">
        <input type="text" id="MaND" placeholder="Mã ND" class="border px-3 py-2 rounded w-32" required>
        <input type="text" id="HoTen" placeholder="Họ tên" class="border px-3 py-2 rounded w-40" required>
        <input type="text" id="CuTruND" placeholder="Cư trú" class="border px-3 py-2 rounded w-40">
        <button type="button" id="addNongDan" class="bg-green-600 text-white px-4 py-2 rounded font-semibold">Thêm</button>
        <button type="button" id="editNongDan" class="bg-yellow-500 text-white px-4 py-2 rounded font-semibold">Sửa</button>
        <button type="button" id="deleteNongDan" class="bg-red-500 text-white px-4 py-2 rounded font-semibold">Xóa</button>
        <button type="button" id="resetNongDan" class="bg-gray-400 text-white px-4 py-2 rounded font-semibold">Reset</button>
      </form>
    </div>

    <!-- Form quản lý thửa đất -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="font-semibold text-lg text-green-700 mb-4">📍 Quản lý thửa đất</h2>
      <form id="formThuaDat" class="flex flex-wrap gap-4 items-end">
        <input type="text" id="MaTD" placeholder="Mã TĐ " class="border px-3 py-2 rounded w-32" required>
        <!-- Mã ND: chọn hoặc nhập, có gợi ý -->
        <input list="listMaND" id="MaND_TD" placeholder="Mã ND" class="border px-3 py-2 rounded w-32" required>
        <datalist id="listMaND"></datalist>
        <input type="text" id="DiaChiTD" placeholder="Địa chỉ" class="border px-3 py-2 rounded w-40">
        <div class="w-full flex gap-4 mt-4">
          <button type="button" id="addThuaDat" class="bg-green-600 text-white px-4 py-2 rounded font-semibold">Thêm</button>
          <button type="button" id="editThuaDat" class="bg-yellow-500 text-white px-4 py-2 rounded font-semibold">Sửa</button>
          <button type="button" id="deleteThuaDat" class="bg-red-500 text-white px-4 py-2 rounded font-semibold">Xóa</button>
          <button type="button" id="resetThuaDat" class="bg-gray-400 text-white px-4 py-2 rounded font-semibold">Reset</button>
        </div>
      </form>
    </div>

    <!-- Form quản lý vụ trồng -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="font-semibold text-lg text-green-700 mb-4">🌾 Quản lý vụ trồng</h2>
      <form id="formVuTrong" class="flex flex-wrap gap-4 items-end">
        <!-- Mã ND: nhập hoặc chọn gợi ý -->
        <input list="listMaND_VT" id="MaND_VT" placeholder="Mã ND" class="border px-3 py-2 rounded w-32" required>
        <datalist id="listMaND_VT"></datalist>
        <!-- Mã thửa đất: nhập hoặc chọn gợi ý -->
        <input list="listMaTD_VT" id="MaTD_VT" placeholder="Mã TĐ" class="border px-3 py-2 rounded w-32" required>
        <datalist id="listMaTD_VT"></datalist>
        <!-- Mã cây: nhập hoặc chọn gợi ý -->
        <input list="listMaC_VT" id="MaC_VT" placeholder="Mã cây" class="border px-3 py-2 rounded w-32" required>
        <datalist id="listMaC_VT"></datalist>
        <input type="date" id="ThoiGianBatDau_VT" class="border px-3 py-2 rounded w-40" placeholder="Bắt đầu">
        <input type="date" id="ThoiGianKetThuc_VT" class="border px-3 py-2 rounded w-40" placeholder="Kết thúc">
        <button type="button" id="addVuTrong" class="bg-green-600 text-white px-4 py-2 rounded font-semibold">Thêm</button>
        <button type="button" id="editVuTrong" class="bg-yellow-500 text-white px-4 py-2 rounded font-semibold">Sửa</button>
        <button type="button" id="deleteVuTrong" class="bg-red-500 text-white px-4 py-2 rounded font-semibold">Xóa</button>
        <button type="button" id="resetVuTrong" class="bg-gray-400 text-white px-4 py-2 rounded font-semibold">Reset</button>
      </form>
    </div>

    <!-- Bảng hiển thị kết quả sau thao tác -->
    <div class="bg-white rounded-xl shadow p-6">
      <div class="flex gap-4 mb-4">
        <button type="button" id="showCayTrong" class="bg-green-500 text-white px-4 py-2 rounded font-semibold hover:bg-green-600">Cây trồng</button>
        <button type="button" id="showNongDan" class="bg-green-500 text-white px-4 py-2 rounded font-semibold hover:bg-green-600">Nông dân</button>
        <button type="button" id="showThuaDat" class="bg-green-500 text-white px-4 py-2 rounded font-semibold hover:bg-green-600">Thửa đất</button>
        <button type="button" id="showVuTrong" class="bg-green-500 text-white px-4 py-2 rounded font-semibold hover:bg-green-600">Vụ trồng</button>
      </div>
      <h2 class="font-semibold text-lg text-green-700 mb-4" id="resultTitle">📋 Kết quả thao tác</h2>
      <div id="resultTable"></div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    // Hiển thị tên đăng nhập nếu có
    const username = localStorage.getItem("username");
    document.getElementById("username-display").textContent = username ? username : "Khách";

    // Thêm cây trồng
    $('#addCayTrong').on('click', function() {
      const data = {
        MaC: $('#MaC').val(),
        TenC: $('#TenC').val(),
        CachCanhTac: $('#CachCanhTac').val(),
        PhanBon: $('#PhanBon').val(),
        NguonGoc: $('#NguonGoc').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Cay_Trong/api_insert_cay_trong.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.status === "success" ? "Thêm thành công!" : "Thêm thất bại!");
          showResultTable('caytrong');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Sửa cây trồng
    $('#editCayTrong').on('click', function() {
      const data = {
        MaC: $('#MaC').val(),
        TenC: $('#TenC').val(),
        CachCanhTac: $('#CachCanhTac').val(),
        PhanBon: $('#PhanBon').val(),
        NguonGoc: $('#NguonGoc').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Cay_Trong/api_update_cay_trong.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.message || (res.status === "success" ? "Sửa thành công!" : "Sửa thất bại!"));
          showResultTable('caytrong');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Xóa cây trồng
    $('#deleteCayTrong').on('click', function() {
      const MaC = $('#MaC').val();
      if (!MaC) return alert("Nhập mã cây cần xóa!");
      $.ajax({
        url: "http://localhost/qlvt/php/Cay_Trong/api_remove_cay_trong.php",
        type: "POST",
        data: { MaC },
        dataType: "json",
        success: function(res) {
          alert(res.success ? "Xóa thành công!" : "Xóa thất bại!");
          showResultTable('caytrong');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Thêm nông dân
    $('#addNongDan').on('click', function() {
      const data = {
        MaND: $('#MaND').val(),
        HoTen: $('#HoTen').val(),
        CuTru: $('#CuTruND').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Nong_Dan/api_insert_nong_dan.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          if (res.success) {
            alert(res.message || "Thêm thành công!");
          } else {
            alert(res.message || "Thêm thất bại!");
          }
          showResultTable('nongdan');
          loadSelectOptions(); // Tự động cập nhật lại datalist mã nông dân cho form thửa đất
        },
        error: function(xhr, status, error) {
          let msg = "Lỗi khi gửi yêu cầu đến server!";
          if (xhr && xhr.responseText) {
            msg += "\n" + xhr.responseText;
          }
          alert(msg);
        }
      });
    });

    // Sửa nông dân
    $('#editNongDan').on('click', function() {
      const data = {
        MaND: $('#MaND').val(),
        HoTen: $('#HoTen').val(),
        CuTru: $('#CuTruND').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Nong_Dan/api_update_nong_dan.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          if (res.success) {
            alert(res.message || "Sửa thành công!");
          } else {
            alert(res.message || "Sửa thất bại!");
          }
          showResultTable('nongdan');
        },
        error: function(xhr, status, error) {
          let msg = "Lỗi khi gửi yêu cầu đến server!";
          if (xhr && xhr.responseText) {
            msg += "\n" + xhr.responseText;
          }
          alert(msg);
        }
      });
    });

    // Xóa nông dân
    $('#deleteNongDan').on('click', function() {
      const MaND = $('#MaND').val();
      if (!MaND) return alert("Nhập mã nông dân cần xóa!");
      $.ajax({
        url: "http://localhost/qlvt/php/Nong_Dan/api_remove_nong_dan.php",
        type: "POST",
        data: { MaND },
        dataType: "json",
        success: function(res) {
          alert(res.status === "success" ? "Xóa thành công!" : "Xóa thất bại!");
          showResultTable('nongdan');
          loadSelectOptions(); // Tự động cập nhật lại datalist mã nông dân cho form thửa đất sau khi xóa
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Thêm thửa đất
    $('#addThuaDat').on('click', function() {
      const data = {
        MaTD: $('#MaTD').val(),
        MaND: $('#MaND_TD').val(),
        DiaChi: $('#DiaChiTD').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Thua_Dat/api_insert_thua_dat.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.success ? "Thêm thành công!" : (res.message || "Thêm thất bại!"));
          showResultTable('thuadat');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Sửa thửa đất
    $('#editThuaDat').on('click', function() {
      const data = {
        MaTD: $('#MaTD').val(),
        MaND: $('#MaND_TD').val(),
        DiaChi: $('#DiaChiTD').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Thua_Dat/api_update_thua_dat.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          // Sửa lại kiểm tra kết quả trả về
          if (res.success === true || res.success === "true") {
            alert(res.message || "Sửa thành công!");
          } else {
            alert(res.message || "Sửa thất bại!");
          }
          showResultTable('thuadat');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Xóa thửa đất
    $('#deleteThuaDat').on('click', function() {
      const MaTD = $('#MaTD').val();
      if (!MaTD) return alert("Nhập mã thửa đất cần xóa!");
      $.ajax({
        url: "http://localhost/qlvt/php/Thua_Dat/api_remove_thua_dat.php",
        type: "POST",
        data: { MaTD },
        dataType: "json",
        success: function(res) {
          if (res.success) {
            alert(res.message || "Xóa thành công!");
          } else {
            alert(res.message || "Xóa thất bại!");
          }
          showResultTable('thuadat');
        },
        error: function(xhr) {
  alert("Lỗi server: " + xhr.status + " - " + (xhr.responseText || ''));
}

      });
    });

    // Thêm vụ trồng
    $('#addVuTrong').on('click', function() {
      const data = {
        MaND: $('#MaND_VT').val(),
        MaTD: $('#MaTD_VT').val(),
        MaC: $('#MaC_VT').val(),
        ThoiGianBatDau: $('#ThoiGianBatDau_VT').val(),
        ThoiGianKetThuc: $('#ThoiGianKetThuc_VT').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Vu_Trong/api_add_trong.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.status === "success" ? "Thêm thành công!" : "Thêm thất bại!");
          showResultTable('vutrong');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Sửa vụ trồng
    $('#editVuTrong').on('click', function() {
      const oldMaND = $('#MaND_VT').data('old-value');
      const oldMaTD = $('#MaTD_VT').data('old-value');
      const oldMaC = $('#MaC_VT').data('old-value');
      const oldBatDau = $('#ThoiGianBatDau_VT').data('old-value');
      const oldKetThuc = $('#ThoiGianKetThuc_VT').data('old-value');

      const data = {
        MaND: $('#MaND_VT').val(),
        MaTD: $('#MaTD_VT').val(),
        MaC: $('#MaC_VT').val(),
        ThoiGianBatDau: $('#ThoiGianBatDau_VT').val(),
        ThoiGianKetThuc: $('#ThoiGianKetThuc_VT').val(),
        OldMaND: oldMaND,
        OldMaTD: oldMaTD,
        OldMaC: oldMaC,
        OldBatDau: oldBatDau,
        OldKetThuc: oldKetThuc
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Vu_Trong/api_update_trong.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.status === "success" ? "Sửa vụ trồng thành công!" : "Sửa vụ trồng thất bại!");
          showResultTable('vutrong');
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Xóa vụ trồng
    $('#deleteVuTrong').on('click', function() {
      const data = {
        MaND: $('#MaND_VT').val(),
        MaTD: $('#MaTD_VT').val(),
        MaC: $('#MaC_VT').val(),
        ThoiGianBatDau: $('#ThoiGianBatDau_VT').val(),
        ThoiGianKetThuc: $('#ThoiGianKetThuc_VT').val()
      };
      $.ajax({
        url: "http://localhost/qlvt/php/Vu_Trong/api_remove_trong.php",
        type: "POST",
        data: data,
        dataType: "json",
        success: function(res) {
          alert(res.status === "success" ? "Xóa thành công!" : "Xóa thất bại!");
          showResultTable('vutrong');
          loadVuTrongOptions();
        },
        error: function() {
          alert("Lỗi khi gửi yêu cầu đến server!");
        }
      });
    });

    // Hiển thị bảng kết quả sau thao tác
    function showResultTable(type) {
      setResultTitle(type);
      let url = "";
      if (type === 'caytrong') url = "http://localhost/qlvt/php/Cay_Trong/api_get_cay_trong.php";
      else if (type === 'nongdan') url = "http://localhost/qlvt/php/Nong_Dan/api_get_nong_dan.php";
      else if (type === 'thuadat') url = "http://localhost/qlvt/php/Thua_Dat/api_get_thua_dat.php";
      else if (type === 'vutrong') url = "http://localhost/qlvt/php/Vu_Trong/api_get_trong.php";
      else return;

      $.ajax({
        url: url,
        type: "POST",
        dataType: "json",
        success: function(res) {
          if (res.data) {
            renderTable(res.data, type);
          } else {
            renderTable(res, type);
          }
        },
        error: function() {
          alert("Lỗi khi lấy dữ liệu!");
        }
      });
    }

    // Hiện tiêu đề bảng kết quả theo loại
    function setResultTitle(type) {
      let title = "📋 Kết quả thao tác";
      if (type === 'caytrong') title = "🌱 Bảng cây trồng";
      else if (type === 'nongdan') title = "👩‍🌾 Bảng nông dân";
      else if (type === 'thuadat') title = "📍 Bảng thửa đất";
      else if (type === 'vutrong') title = "🌾 Bảng vụ trồng";
      $('#resultTitle').text(title);
    }

    // Hàm render bảng kết quả
    function renderTable(data, type) {
      let s = '';
      let stt = 1;
      if (!Array.isArray(data)) data = [];
      if (type === 'caytrong') {
        s += `<table class="w-full text-sm text-gray-700"><thead><tr>
          <th class="px-6 py-3 text-left">STT</th>
          <th class="px-6 py-3 text-left">Mã cây</th>
          <th class="px-6 py-3 text-left">Tên cây</th>
          <th class="px-6 py-3 text-left">Cách canh tác</th>

    // Hàm loại bỏ dấu tiếng Việt
    function removeVietnameseTones(str) {
      str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      str = str.replace(/đ/g, 'd').replace(/Đ/g, 'D');
      return str;
    }

    // Hàm filter liên kết các bảng
    function filterTables(keyword) {
      keyword = keyword.toLowerCase();
      let keywordNoSign = removeVietnameseTones(keyword);

      // --- Cây trồng ---
      let matchedMaC = [];
      let cayTrongFound = false;
      $('.addListCayTrong tr').each(function() {
        let tds = $(this).find('td');
        let maC = tds.eq(1).text().trim();
        let tenC = tds.eq(2).text().toLowerCase();
        let cachCanhTac = tds.eq(3).text().toLowerCase();
        let phanBon = tds.eq(4).text().toLowerCase();
        let nguonGoc = tds.eq(5).text().toLowerCase();

        let allText = [
          maC, tenC, cachCanhTac, phanBon, nguonGoc
        ].map(txt => txt + removeVietnameseTones(txt)).join(' ').toLowerCase();

        if (allText.includes(keyword) || allText.includes(keywordNoSign)) {
          matchedMaC.push(maC);
          $(this).show();
          cayTrongFound = true;
        } else {
          $(this).hide();
        }
      });

      // --- Vụ trồng ---
      let matchedMaTD = [];
      let matchedMaND = [];
      let vuTrongFound = false;
      $('.addListVuTrong tr').each(function() {
        let tds = $(this).find('td');
        let maND_vt = tds.eq(1).text().trim();
        let maTD_vt = tds.eq(2).text().trim();
        let maC_vt = tds.eq(3).text().trim();
        let thoiGianBatDau = tds.eq(4).text().toLowerCase();
        let thoiGianKetThuc = tds.eq(5).text().toLowerCase();

        let allText = [
          maND_vt, maTD_vt, maC_vt, thoiGianBatDau, thoiGianKetThuc
        ].map(txt => txt + removeVietnameseTones(txt)).join(' ').toLowerCase();

        // Nếu vụ trồng liên quan đến cây trồng hoặc khớp từ khóa
        if (
          matchedMaC.includes(maC_vt) ||
          allText.includes(keyword) ||
          allText.includes(keywordNoSign)
        ) {
          matchedMaTD.push(maTD_vt);
          matchedMaND.push(maND_vt);
          $(this).show();
          vuTrongFound = true;
        } else {
          $(this).hide();
        }
      });

      // --- Thửa đất ---
      let thuaDatFound = false;
      $('.addListThuaDat tr').each(function() {
        let tds = $(this).find('td');
        let maTD = tds.eq(1).text().trim();
        let maND_td = tds.eq(2).text().trim();
        let diaChi = tds.eq(3).text().toLowerCase();

        let allText = [
          maTD, maND_td, diaChi
        ].map(txt => txt + removeVietnameseTones(txt)).join(' ').toLowerCase();

        // Nếu thửa đất liên quan đến vụ trồng hoặc khớp từ khóa
        if (
          matchedMaTD.includes(maTD) ||
          allText.includes(keyword) ||
          allText.includes(keywordNoSign)
        ) {
          $(this).show();
          thuaDatFound = true;
        } else {
          $(this).hide();
        }
      });

      // --- Nông dân ---
      let nongDanFound = false;
      $('.addListNongDan tr').each(function() {
        let tds = $(this).find('td');
        let maND = tds.eq(1).text().trim();
        let hoTen = tds.eq(2).text().toLowerCase();
        let cuTru = tds.eq(3).text().toLowerCase();

        let allText = [
          maND, hoTen, cuTru
        ].map(txt => txt + removeVietnameseTones(txt)).join(' ').toLowerCase();

        // Nếu nông dân liên quan đến vụ trồng hoặc khớp từ khóa
        if (
          matchedMaND.includes(maND) ||
          allText.includes(keyword) ||
          allText.includes(keywordNoSign)
        ) {
          $(this).show();
          nongDanFound = true;
        } else {
          $(this).hide();
        }
      });

      // Ẩn bảng nếu không có dòng nào hiển thị
      $('.addListCayTrong').closest('.bg-white.shadow-lg').toggle(cayTrongFound || keyword === "");
      $('.addListNongDan').closest('.bg-white.shadow-lg').toggle(nongDanFound || keyword === "");
      $('.addListThuaDat').closest('.bg-white.shadow-lg').toggle(thuaDatFound || keyword === "");
      $('.addListVuTrong').closest('.bg-white.shadow-lg').toggle(vuTrongFound || keyword === "");

      // Hiển thị thông báo nếu không có kết quả
      if (!cayTrongFound && !nongDanFound && !thuaDatFound && !vuTrongFound && keyword !== "") {
        if ($('#noResultMsg').length === 0) {
          $('<div id="noResultMsg" class="text-center text-red-500 text-lg font-semibold my-8">Không tìm thấy kết quả</div>')
            .insertAfter('.flex.justify-center.mb-8');
        }
      } else {
        $('#noResultMsg').remove();
      }
    }

    // Gọi hàm filterTables khi nhập từ khóa
    $('#searchInput').on('input', function() {
      filterTables($(this).val());
    });

      $('#ThoiGianKetThuc_VT').val(tds.eq(5).text()).data('old-value', tds.eq(5).text());
    });


  </script>
